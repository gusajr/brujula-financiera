name: Actualizar tasas y cierres
on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/refresh-market.mjs
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
      - run: npm test
      - name: Publicar archivos validados
        run: |
          git add dist/rates.json dist/market.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Actualiza tasas y cierres'
          git push origin HEAD:master
